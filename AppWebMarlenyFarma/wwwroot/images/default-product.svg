<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e397d"/>
      <stop offset="100%" stop-color="#1e2a5e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle circular ring -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 8" opacity="0.7"/>
  <circle cx="200" cy="180" r="95" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.06))"/>

  <!-- Medicine Bottle / Capsule Graphic -->
  <g transform="translate(200, 180) rotate(-25) translate(-200, -180)">
    <!-- Capsule Bottom -->
    <path d="M 170 140 C 170 120 230 120 230 140 L 230 180 L 170 180 Z" fill="url(#primaryGrad)"/>
    <!-- Capsule Top -->
    <path d="M 170 180 L 230 180 L 230 220 C 230 240 170 240 170 220 Z" fill="url(#accentGrad)"/>
    <!-- Capsule Shine -->
    <path d="M 180 135 C 180 128 195 125 200 125 C 195 130 195 150 195 160 L 180 160 Z" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Medical Cross Badge -->
  <g transform="translate(230, 210)">
    <circle cx="20" cy="20" r="28" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <circle cx="20" cy="20" r="24" fill="url(#accentGrad)"/>
    <path d="M 17 10 H 23 V 17 H 30 V 23 H 23 V 30 H 17 V 23 H 10 V 17 H 17 Z" fill="#ffffff"/>
  </g>

  <!-- Brand / Placeholder Label -->
  <text x="200" y="325" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2e397d" letter-spacing="0.5">
    MarlenyFarma
  </text>
  <text x="200" y="350" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">
    Imagen de producto
  </text>
</svg>
