name: Integración continua y despliegue

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Etapa 1: compilación y pruebas automatizadas
  # ---------------------------------------------------------------------------
  calidad:
    name: Compilar y ejecutar pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Descargar código fuente
        uses: actions/checkout@v4

      - name: ⚙️ Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: 📦 Restaurar dependencias
        run: dotnet restore tests/MarlenyFarma.UnitTests/MarlenyFarma.UnitTests.csproj

      - name: 🔨 Compilar en Release
        run: dotnet build tests/MarlenyFarma.UnitTests/MarlenyFarma.UnitTests.csproj -c Release --no-restore

      - name: 🧪 Ejecutar pruebas unitarias con cobertura
        run: >
          dotnet test tests/MarlenyFarma.UnitTests/MarlenyFarma.UnitTests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=unitarias.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: 📊 Resumen de cobertura
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: TestResults/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: 📝 Publicar resumen en el job
        if: always()
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: 📤 Publicar artefactos de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            TestResults/**
            code-coverage-results.md
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Etapa 2: publicación y despliegue (solo si las pruebas pasaron)
  # ---------------------------------------------------------------------------
  build-and-deploy:
    name: Compilar y Desplegar
    needs: calidad
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Descargar código fuente
        uses: actions/checkout@v4

      - name: ⚙️ Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: 🔐 Configurar Cadena de Conexión de Producción (Opcional)
        if: ${{ secrets.DB_CONNECTION_STRING != '' }}
        shell: bash
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          PROD_FILE="AppWebMarlenyFarma/appsettings.Production.json"
          if [ -f "$PROD_FILE" ]; then
            jq --arg cs "$DB_CONNECTION_STRING" '.ConnectionStrings.ConexionDB = $cs' "$PROD_FILE" > tmp.json
            mv tmp.json "$PROD_FILE"
          fi

      - name: 📦 Restaurar dependencias
        run: dotnet restore AppWebMarlenyFarma/AppWebMarlenyFarma.csproj

      - name: 🔨 Compilar y Publicar Proyecto
        run: >
          dotnet publish AppWebMarlenyFarma/AppWebMarlenyFarma.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o ./publish

      - name: 🚀 Subir a MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/site/wwwroot/' }}
          dangerous-clean-slate: false
