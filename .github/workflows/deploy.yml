name: Integración continua y despliegue

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Etapa 1: compilación y pruebas automatizadas
  # ---------------------------------------------------------------------------
  calidad:
    name: Compilar y validar calidad
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Descargar código fuente
        uses: actions/checkout@v4

      - name: ⚙️ Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: 📦 Restaurar dependencias
        run: dotnet restore AppWebMarlenyFarma/AppWebMarlenyFarma.csproj

      - name: 🔨 Compilar en Release
        run: dotnet build AppWebMarlenyFarma/AppWebMarlenyFarma.csproj -c Release --no-restore

      - name: 🧪 Ejecutar pruebas unitarias (si existen)
        run: |
          if [ -f "tests/MarlenyFarma.UnitTests/MarlenyFarma.UnitTests.csproj" ]; then
            dotnet test tests/MarlenyFarma.UnitTests/MarlenyFarma.UnitTests.csproj \
              -c Release \
              --logger "trx;LogFileName=unitarias.trx" \
              --collect:"XPlat Code Coverage" \
              --results-directory ./TestResults
          else
            echo "ℹ️ No se detectó proyecto de pruebas unitarias, omitiendo..."
          fi

      - name: 📊 Resumen de cobertura
        if: hashFiles('TestResults/**/coverage.cobertura.xml') != ''
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: TestResults/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: 📝 Publicar resumen en el job
        if: hashFiles('code-coverage-results.md') != ''
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: 📤 Publicar artefactos de prueba
        if: hashFiles('TestResults/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            TestResults/**
            code-coverage-results.md
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Etapa 2: publicación y despliegue (solo si las pruebas pasaron)
  # ---------------------------------------------------------------------------
  build-and-deploy:
    name: Compilar y Desplegar
    needs: calidad
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Descargar código fuente
        uses: actions/checkout@v4

      - name: ⚙️ Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: 🔐 Configurar Cadena de Conexión de Producción (Opcional)
        shell: bash
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          if [ -n "$DB_CONNECTION_STRING" ]; then
            PROD_FILE="AppWebMarlenyFarma/appsettings.Production.json"
            if [ -f "$PROD_FILE" ]; then
              jq --arg cs "$DB_CONNECTION_STRING" '.ConnectionStrings.ConexionDB = $cs' "$PROD_FILE" > tmp.json
              mv tmp.json "$PROD_FILE"
            fi
          fi

      - name: 📦 Restaurar dependencias
        run: dotnet restore AppWebMarlenyFarma/AppWebMarlenyFarma.csproj

      - name: 🔨 Compilar y Publicar Proyecto
        run: >
          dotnet publish AppWebMarlenyFarma/AppWebMarlenyFarma.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o ./publish

      - name: ⏸️ Liberar archivos bloqueados en IIS (app_offline.htm)
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Actualizando</title></head><body><h2>Actualizando sitio...</h2></body></html>' > app_offline.htm
          python3 - << 'EOF'
          import os, sys
          from ftplib import FTP, FTP_TLS

          host = os.environ.get("FTP_SERVER", "")
          user = os.environ.get("FTP_USERNAME", "")
          passwd = os.environ.get("FTP_PASSWORD", "")

          if not host or not user or not passwd:
              print("ℹ️ Credenciales FTP incompletas, omitiendo subida de app_offline.htm")
              sys.exit(0)

          ftp = None
          try:
              ftp = FTP_TLS()
              ftp.connect(host, 21, timeout=15)
              ftp.login(user, passwd)
              ftp.prot_p()
              print("🔒 Conexión segura FTPS establecida.")
          except Exception as e:
              print(f"ℹ️ FTPS no disponible ({e}), conectando por FTP estándar...")
              try:
                  ftp = FTP()
                  ftp.connect(host, 21, timeout=15)
                  ftp.login(user, passwd)
              except Exception as err:
                  print(f"⚠️ No se pudo conectar vía FTP: {err}")
                  sys.exit(0)

          try:
              with open("app_offline.htm", "rb") as f:
                  ftp.storbinary("STOR /wwwroot/app_offline.htm", f)
              print("✅ app_offline.htm colocado con éxito.")
          except Exception as e:
              print(f"⚠️ No se pudo guardar app_offline.htm: {e}")
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass
          EOF
          sleep 3

      - name: 🚀 Subir a MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/wwwroot/' }}
          dangerous-clean-slate: false

      - name: ▶️ Reactivar sitio (eliminar app_offline.htm)
        if: always()
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, sys
          from ftplib import FTP, FTP_TLS

          host = os.environ.get("FTP_SERVER", "")
          user = os.environ.get("FTP_USERNAME", "")
          passwd = os.environ.get("FTP_PASSWORD", "")

          if not host or not user or not passwd:
              sys.exit(0)

          ftp = None
          try:
              ftp = FTP_TLS()
              ftp.connect(host, 21, timeout=15)
              ftp.login(user, passwd)
              ftp.prot_p()
          except Exception:
              try:
                  ftp = FTP()
                  ftp.connect(host, 21, timeout=15)
                  ftp.login(user, passwd)
              except Exception as err:
                  print(f"⚠️ No se pudo conectar para reactivar: {err}")
                  sys.exit(0)

          try:
              ftp.delete("/wwwroot/app_offline.htm")
              print("✅ app_offline.htm eliminado. Sitio reactivado correctamente.")
          except Exception as e:
              print(f"ℹ️ app_offline.htm ya no estaba presente o no se eliminó: {e}")
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass
          EOF
